<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>واحة النور</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Baloo+Bhaijaan+2:wght@400;600;800&display=swap">
<style>
/* Layout: one scrolling desert world split into 3 regions (units); each lesson is a plot you build on. Modals for story + building quiz. Single sunny look by choice. */
:root{
  --sand:#f3d9a4; --sand-deep:#e2b86d; --dune:#d99a4e; --sky:#8fd3f4; --sky-2:#fef3c7;
  --grass:#7cc95a; --grass-deep:#3f8f3a; --ink:#3b2412; --ink-soft:#7a5532;
  --card:#fffaf0; --gold:#f5b51f; --rose:#ef5d8e; --violet:#9b6ae0; --blue:#3f9be0; --green:#3fae4f;
  --bad:#e5484d; --good:#2f9e44;
  --display:"Lalezar","Baloo Bhaijaan 2",system-ui,sans-serif;
  --body:"Baloo Bhaijaan 2","Segoe UI",Tahoma,system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--sand);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.7;direction:rtl;overflow-x:hidden}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:#fff6e0}

/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;
  padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:#fff6e0;border-bottom:3px solid var(--sand-deep)}
.brand{font-family:var(--display);font-size:26px;line-height:1;color:var(--ink);display:flex;align-items:center;gap:6px}
.brand small{font-family:var(--body);font-size:12px;color:var(--ink-soft);font-weight:600}
.stats{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:4px;background:var(--card);border:2px solid var(--sand-deep);border-radius:999px;padding:2px 10px;font-weight:800;font-variant-numeric:tabular-nums;font-size:15px}
.pill.bump{animation:bump .4s}
@keyframes bump{50%{transform:scale(1.25)}}
.hud-actions{display:flex;gap:6px}
.btn{border:0;border-radius:14px;padding:8px 14px;font-weight:800;font-size:15px;background:var(--gold);box-shadow:0 4px 0 #c48a0b;transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #c48a0b}
.btn.alt{background:#fff;box-shadow:0 4px 0 var(--sand-deep)}
.btn.green{background:var(--green);color:#fff;box-shadow:0 4px 0 var(--grass-deep)}
.btn.big{font-size:20px;padding:12px 26px;border-radius:18px}

/* World */
.sky{position:relative;height:150px;background:linear-gradient(var(--sky),var(--sky-2));overflow:hidden}
.sun{position:absolute;top:18px;left:28px;width:70px;height:70px;border-radius:50%;background:radial-gradient(#fff7b0,#ffcf3a);box-shadow:0 0 50px #ffd84a}
.cloud{position:absolute;font-size:44px;opacity:.9;animation:drift 40s linear infinite}
@keyframes drift{from{transform:translateX(-120px)}to{transform:translateX(110vw)}}
.sky-dunes{position:absolute;bottom:-2px;left:0;width:100%;height:70px}
.welcome{position:absolute;inset:auto 0 18px 0;text-align:center;font-family:var(--display);font-size:clamp(20px,5vw,30px);color:var(--ink);text-shadow:0 2px 0 #fff8}

.world{padding-bottom:40px}
.region{position:relative;padding-block:22px 30px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:hidden}
.region .bg{position:absolute;inset:0;background:radial-gradient(ellipse at 30% 20%,#f8e3b6,var(--sand) 60%,var(--sand-deep));z-index:0}
.region .green{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,#b6e88f,var(--grass) 60%,#5fb04a);z-index:0;transition:opacity 1.2s}
.region .decor{position:absolute;inset:0;z-index:1;pointer-events:none}
.decor span{position:absolute;font-size:30px;filter:drop-shadow(0 3px 2px #0003);animation:pop .5s}
.region-head{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.ribbon{font-family:var(--display);font-size:clamp(20px,4.6vw,28px);background:var(--card);border:3px solid var(--ink);border-radius:16px;padding:4px 18px;box-shadow:0 5px 0 var(--ink);text-align:center;line-height:1.4}
.ribbon small{display:block;font-family:var(--body);font-size:13px;color:var(--ink-soft);font-weight:700}
.region.locked .plots{filter:grayscale(.6) opacity(.7)}
.lock-note{position:relative;z-index:2;text-align:center;font-weight:800;background:#fff8;border-radius:12px;padding:6px 12px;margin:0 auto 12px;width:fit-content;max-width:100%}

.plots{position:relative;z-index:2;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px;max-width:1000px;margin:0 auto}
.plot{position:relative;border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.plot .land{position:relative;width:100%;aspect-ratio:1.25;max-width:100%;border-radius:50% 50% 46% 46%/40% 40% 60% 60%;display:grid;place-items:center;
  background:radial-gradient(ellipse at 50% 35%,#f6e2b8,#dcae63);box-shadow:inset 0 -10px 0 #c98f45,0 6px 0 #0001;transition:transform .15s}
.plot:hover .land{transform:translateY(-3px)}
.plot.built .land{background:radial-gradient(ellipse at 50% 35%,#c8f0a5,#6fc152);box-shadow:inset 0 -10px 0 #4b9a3c,0 6px 0 #0001}
.plot .bld{font-size:clamp(54px,14vw,72px);line-height:1;filter:drop-shadow(0 6px 3px #0004)}
.plot:not(.built) .bld{font-size:44px;filter:grayscale(1) opacity(.35)}
.sign{position:absolute;bottom:8%;background:#a8692f;color:#fff8e6;font-weight:800;font-size:13px;padding:2px 10px;border-radius:8px;box-shadow:0 3px 0 #7a4a1e;white-space:nowrap}
.plot.next .land{animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:inset 0 -10px 0 #c98f45,0 0 0 6px #ffe27a,0 0 26px 8px #ffd23f}}
.plot .label{font-weight:800;font-size:14px;text-align:center;line-height:1.35;background:#fffaf0dd;border-radius:10px;padding:2px 8px;max-width:100%}
.plot .stars{font-size:13px;letter-spacing:1px;min-height:18px}
.harvest{position:absolute;top:-6px;left:6px;background:var(--gold);border:3px solid #fff;border-radius:50%;width:40px;height:40px;display:grid;place-items:center;font-size:20px;box-shadow:0 4px 8px #0003;animation:float 1.4s ease-in-out infinite;z-index:3}
@keyframes float{50%{transform:translateY(-6px)}}
.pin{position:absolute;top:-4px;right:8px;font-size:28px;animation:float 1.2s ease-in-out infinite}

/* overlay / modal */
.overlay{position:fixed;inset:0;z-index:100;background:#3b241299;display:grid;place-items:center;
  padding-block:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-bottom,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.modal{width:min(720px,100%);max-height:100%;overflow:auto;background:var(--card);border:4px solid var(--ink);border-radius:26px;box-shadow:0 10px 0 var(--ink);position:relative;animation:pop .35s}
@keyframes pop{from{transform:scale(.85);opacity:.3}}
.m-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:3px dashed var(--sand-deep)}
.m-head .ic{font-size:40px}
.m-head h2{margin:0;font-family:var(--display);font-weight:400;font-size:24px;line-height:1.25;text-wrap:balance}
.m-head p{margin:0;font-size:13px;color:var(--ink-soft);font-weight:700}
.x{margin-inline-start:auto;border:0;background:#fff;border-radius:50%;width:38px;height:38px;font-size:20px;box-shadow:0 3px 0 var(--sand-deep);flex:none}
.m-body{padding:16px}

/* story */
.scene{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:end}
.scene img{width:120px;height:auto;filter:drop-shadow(0 6px 4px #0003);animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px) rotate(-1deg)}}
.bubble{position:relative;background:#fff;border:3px solid var(--ink);border-radius:20px;padding:14px 16px;font-size:18px;line-height:1.85;min-width:0}
.bubble::after{content:"";position:absolute;bottom:18px;right:-20px;border:10px solid transparent;border-left-color:var(--ink)}
.bubble .who{display:inline-block;font-family:var(--display);font-size:18px;color:#fff;border-radius:10px;padding:0 10px;margin-bottom:6px}
.bubble mark{background:linear-gradient(transparent 45%,#ffe27a 45%);color:inherit;font-weight:800;padding:0 2px}
.bubble .quote{display:block;margin-top:8px;background:#f2fbe9;border-right:5px solid var(--green);border-radius:10px;padding:6px 10px;font-weight:700}
.bubble ul{margin:6px 0 0;padding-inline-start:20px}
.dots{display:flex;gap:6px;justify-content:center;margin:14px 0 6px;flex-wrap:wrap}
.dots i{width:12px;height:12px;border-radius:50%;background:#e8d3a8}
.dots i.on{background:var(--gold);transform:scale(1.2)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:10px;flex-wrap:wrap}
.brick-note{text-align:center;font-weight:800;color:var(--ink-soft);font-size:14px}

/* build */
.site{position:relative;height:150px;display:grid;place-items:center;margin-bottom:10px;background:linear-gradient(#cfeefc,#fff4d6 70%,#e9c98c 70%);border-radius:18px;overflow:hidden}
.site .ghost,.site .real{position:absolute;font-size:110px;line-height:1;bottom:24px}
.site .ghost{filter:grayscale(1) opacity(.18)}
.site .real{transition:clip-path .7s ease;filter:drop-shadow(0 6px 3px #0004)}
.site .crane{position:absolute;top:6px;right:12px;font-size:34px}
.meter{display:flex;gap:4px;justify-content:center;margin-bottom:12px}
.meter b{flex:1;max-width:60px;height:10px;border-radius:6px;background:#ead7b0}
.meter b.ok{background:var(--green)}
.qnar{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.qnar img{width:56px;height:auto}
.qtext{font-weight:800;font-size:19px;line-height:1.6}
.opts{display:grid;gap:10px}
.opt{text-align:right;border:3px solid var(--sand-deep);background:#fff;border-radius:16px;padding:10px 14px;font-size:17px;font-weight:700;box-shadow:0 4px 0 var(--sand-deep);transition:transform .1s}
.opt:hover{transform:translateY(-2px)}
.opt.right{border-color:var(--good);background:#e6f8e9;box-shadow:0 4px 0 var(--good)}
.opt.wrong{border-color:var(--bad);background:#fde8e8;box-shadow:0 4px 0 var(--bad);animation:shake .4s}
@keyframes shake{25%{transform:translateX(6px)}75%{transform:translateX(-6px)}}
.why{margin-top:12px;border-radius:14px;padding:10px 14px;font-weight:700;line-height:1.7}
.why.good{background:#e6f8e9;border:2px solid var(--good)}
.why.bad{background:#fff4e0;border:2px solid var(--gold)}

/* done */
.done{text-align:center}
.done .ic{font-size:110px;line-height:1.1;animation:pop .6s}
.done h3{font-family:var(--display);font-weight:400;font-size:30px;margin:6px 0}
.done .reward{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;font-weight:800;font-size:20px;margin:10px 0}
.done .reward span{background:#fff;border:3px solid var(--sand-deep);border-radius:14px;padding:4px 14px}
.confetti{position:fixed;top:-20px;z-index:200;font-size:22px;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}

/* shop */
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.item{border:3px solid var(--sand-deep);background:#fff;border-radius:16px;padding:10px;text-align:center;box-shadow:0 4px 0 var(--sand-deep)}
.item .e{font-size:44px;line-height:1.2}
.item b{display:block}
.item[disabled]{opacity:.45;cursor:not-allowed}
.region-pick{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:12px}
.region-pick button{border:3px solid var(--sand-deep);background:#fff;border-radius:12px;padding:4px 12px;font-weight:800}
.region-pick button.on{background:var(--gold);border-color:#c48a0b}

/* intro */
.cast{display:flex;justify-content:center;align-items:flex-end;gap:2px;margin:6px 0 10px}
.cast img{width:24%;max-width:120px;height:auto;animation:bob 2.4s ease-in-out infinite}
.cast img:nth-child(2){animation-delay:.3s}.cast img:nth-child(3){animation-delay:.6s}.cast img:nth-child(4){animation-delay:.9s}
.intro p{font-size:18px;text-align:center;margin:6px 0}
.intro h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,9vw,52px);text-align:center;margin:0;line-height:1.2;color:var(--ink)}
.center{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.toast{position:fixed;bottom:max(18px,env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:300;background:var(--ink);color:#fff;font-weight:800;border-radius:14px;padding:8px 18px;animation:pop .3s;max-width:90vw;text-align:center}
.menu{display:grid;gap:10px}
.menu .btn{width:100%}

@media (max-width:480px){
  .scene{grid-template-columns:78px 1fr}
  .scene img{width:78px}
  .bubble{font-size:16.5px;padding:12px}
  .plots{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .brand{font-size:22px}
  .site .ghost,.site .real{font-size:90px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<header class="hud">
  <div class="brand">🌴 واحة النور <small>دين خامسة ابتدائي - الترم الأول</small></div>
  <div class="stats">
    <span class="pill" id="pCoins" title="عملات">🪙 <span id="coins">0</span></span>
    <span class="pill" id="pStars" title="نجوم">⭐ <span id="stars">0</span></span>
    <span class="pill" title="مباني">🏗️ <span id="built">0</span>/20</span>
  </div>
  <div class="hud-actions">
    <button class="btn alt" id="bShop">🛒 السوق</button>
    <button class="btn" id="bQuick">⚡ تحدّي</button>
    <button class="btn alt" id="bMenu" aria-label="القائمة">☰</button>
  </div>
</header>

<section class="sky" aria-hidden="true">
  <div class="sun"></div>
  <div class="cloud" style="top:14px">☁️</div>
  <div class="cloud" style="top:52px;animation-duration:60s;animation-delay:-25s">☁️</div>
  <svg class="sky-dunes" viewBox="0 0 400 70" preserveAspectRatio="none"><path d="M0 50 Q60 10 130 40 T260 30 T400 35 V70 H0Z" fill="#e9c98c"/><path d="M0 60 Q90 30 180 55 T400 50 V70 H0Z" fill="#f3d9a4"/></svg>
  <div class="welcome" id="welcome">الصحرا مستنية تتبني بالعلم!</div>
</section>

<main class="world" id="world"></main>
<div id="layer"></div>

{u:0,title:"سورة الإنسان",b:"بستان الأبرار",ic:"🌳",c:"layan",cards:[
"أنا ليان! هنزرع بستان جميل زي جنة الأبرار 🌳 سورة الإنسان [[سورة مدنية]]، نزلت [[بعد هجرة النبي ﷺ إلى المدينة]]، وعدد آياتها [[31 آية]].",
"ربنا خلق الإنسان و[[بيّن له طريق الهداية وطريق الضلال]] علشان [[يختبره]] ويجازيه على اختياره. يعني [[الدنيا اختبار]].{{﴿إِنَّا هَدَيْنَاهُ السَّبِيلَ إِمَّا شَاكِرًا وَإِمَّا كَفُورًا﴾}}",
"إيه اللي وصّل الأبرار للجنة؟<ul><li>[[يوفون بالنذر]]</li><li>[[يخافون يوم القيامة]] اللي شره [[مستطير]] يعني منتشر</li><li>[[يطعمون الطعام]] وهم بيحبوه لـ [[المسكين واليتيم والأسير]]</li></ul>",
"نعيم الجنة في السورة 🍃<ul><li>يشربوا من كأس مزاجها [[كافور]]</li><li>متكئين على [[الأرائك]] = السرر المزيّنة</li><li>لا يرون فيها [[شمسًا ولا زمهريرًا]] = بردًا شديدًا</li><li>[[ظلال الأشجار قريبة]] منهم، وآنية من [[فضة]]</li></ul>",
"المؤمنين جزاؤهم [[الجنة ونعيمها الدائم]]، والكافرين لهم [[النار وعذابها]].",
"ربنا أمر النبي ﷺ: [[يصبر لحكم الله]]، و[[ما يطيعش آثم ولا كفور]]، و[[يذكر الله بكرة وأصيلًا]] يعني أول النهار وآخره، ويسبّحه ليلًا طويلًا. وكمان: [[مشيئة الله فوق كل مشيئة]].{{﴿وَمَا تَشَاءُونَ إِلَّا أَن يَشَاءَ اللَّهُ﴾}}"
],quiz:[
{q:"سورة الإنسان سورة…",o:["مدنية نزلت بعد الهجرة","مكية نزلت قبل الهجرة","نزلت في الحبشة","نزلت في الطائف"],why:"سورة الإنسان مدنية."},
{q:"معنى «زمهريرًا»:",o:["بردًا شديدًا","حرًّا شديدًا","مطرًا غزيرًا","ريحًا قوية"],why:"لا يرون في الجنة شمسًا ولا زمهريرًا = بردًا شديدًا."},
{q:"الأبرار كانوا يطعمون الطعام لـ…",o:["المسكين واليتيم والأسير","الأغنياء فقط","التجار","الضيوف الأغنياء"],why:"﴿ويطعمون الطعام على حبه مسكينًا ويتيمًا وأسيرًا﴾."},
{q:"«الأرائك» معناها…",o:["السرر المزينة","الأشجار","الأنهار","الأكواب"],why:"يتكئون في راحة على السرر الفاخرة."},
{q:"«بكرة وأصيلًا» يعني…",o:["أول النهار وآخره","نص الليل","وقت الظهر","يوم الجمعة"],why:"البكرة أول النهار، والأصيل آخره."}
]},
{u:0,title:"أحكام النون الساكنة والتنوين",b:"قاعة التجويد",ic:"🏛️",c:"lana",cards:[
"أنا لانا وبحب الأرقام! 🔢 التجويد هو [[علم نعرف بيه إزاي نقرأ القرآن تلاوة صحيحة]].{{«خيرُكم مَن تعلّم القرآن وعلّمه»}}",
"أحكام النون الساكنة والتنوين [[أربعة]]: <mark>إظهار</mark> - <mark>إدغام</mark> - <mark>إقلاب</mark> - <mark>إخفاء</mark>. هنحفظهم كأنهم 4 أوض في القاعة 🏛️",
"1️⃣ [[الإظهار الحلقي]]: ننطق النون واضحة [[من غير غنة]]. حروفه [[6]] من الحلق: <b>ء - هـ - ع - ح - غ - خ</b><br>مثال: مَنْ <b>آ</b>مَنَ ، مِنْ <b>ع</b>ِلْمٍ ، عَلِيمٌ <b>ح</b>َكِيمٌ",
"2️⃣ [[الإدغام]]: حروفه في كلمة [[«يرملون»]] وما بيحصلش غير [[في كلمتين]].<ul><li>[[بغنة]]: حروف «ينمو» (ي ن م و) ← مَنْ <b>ي</b>َقُولُ</li><li>[[بغير غنة]]: (ل ر) ← مِنْ <b>ر</b>َبِّهِمْ ، هُدًى <b>ل</b>ِلْمُتَّقِينَ</li></ul>",
"3️⃣ [[الإقلاب]]: لو جه بعد النون الساكنة أو التنوين حرف [[الباء]] ← تتقلب النون [[ميم]] مع غنة، وعلامتها [[ميم صغيرة (م)]] في المصحف.<br>مثال: مِنْ <b>ب</b>َعْدِ ، سَمِيعٌ <b>ب</b>َصِيرٌ",
"4️⃣ [[الإخفاء]]: باقي الحروف [[15 حرف]]، أوائل كلمات البيت ده:{{صِفْ ذَا ثَنَا كَمْ جَادَ شَخْصٌ قَدْ سَمَا ... دُمْ طَيِّبًا زِدْ فِي تُقًى ضَعْ ظَالِمَا}}مثال: مِنْ <b>ق</b>َبْلِ ، أَنْ <b>ت</b>َقُولُوا"
],quiz:[
{q:"حكم النون في «مَنْ آمَنَ»:",o:["إظهار حلقي","إدغام بغنة","إقلاب","إخفاء"],why:"الهمزة من حروف الإظهار الحلقي."},
{q:"حكم النون في «مِنْ بَعْدِ»:",o:["إقلاب","إظهار","إخفاء","إدغام بغير غنة"],why:"بعدها باء ← إقلاب."},
{q:"حكم النون في «مَنْ يَقُولُ»:",o:["إدغام بغنة","إدغام بغير غنة","إظهار","إقلاب"],why:"الياء من حروف «ينمو» ← إدغام بغنة."},
{q:"حرفا الإدغام بغير غنة هما:",o:["اللام والراء","الياء والنون","الميم والواو","الباء والميم"],why:"الإدغام بغير غنة: ل ، ر."},
{q:"عدد حروف الإخفاء:",o:["15 حرفًا","6 حروف","حرف واحد","4 حروف"],why:"حروف الإخفاء 15، أوائل كلمات «صف ذا ثنا…»."},
{q:"حكم النون في «مِنْ قَبْلِ»:",o:["إخفاء","إظهار","إقلاب","إدغام بغنة"],why:"القاف من حروف الإخفاء."}
]},
{u:0,title:"رمضان شهر الصيام",b:"خيمة الفوانيس",ic:"🏮",c:"adam",cards:[
"أنا آدم المشاغب 😄 وأكتر حاجة بحبها فانوس رمضان! [[رمضان هو الشهر التاسع]] من العام الهجري، والمسلمين بيستنوه [[بشوق]] لأنه [[موسم الطاعات]] وفرصة للتقرب من ربنا.",
"فضائل رمضان ⭐<ul><li>[[نزل فيه القرآن الكريم]]</li><li>[[شهر الصيام والقيام]]</li><li>[[شهر المغفرة والعتق من النار]]</li><li>فيه [[ليلة القدر]]</li></ul>",
"في رمضان بتنزل رحمات ربنا: [[تتفتح أبواب الجنة]]، و[[تتقفل أبواب النار]]، و[[تتقيد الشياطين]].",
"ليلة القدر مميزة جدًا 🌙<ul><li>[[نزل فيها القرآن]]</li><li>[[خير من ألف شهر]]</li><li>[[تتنزل فيها الملائكة]] بالخير والبركة</li><li>[[يُستجاب فيها الدعاء]]</li></ul>{{«مَن قام ليلةَ القدر إيمانًا واحتسابًا غُفر له ما تقدّم من ذنبه»}}",
"كل ليلة في رمضان ربنا [[بيعتق ناس من النار]] ويغفر ذنوبهم 🤲",
"رمضان بيخلي المجتمع أحلى: [[التعاون والتكافل]]، و[[الإفطارات الجماعية]]، و[[الصدقة على المحتاجين]] ← فتزيد [[المحبة والمودة]] بين المسلمين."
],quiz:[
{q:"ترتيب شهر رمضان في العام الهجري:",o:["التاسع","الأول","الثاني عشر","السابع"],why:"رمضان هو الشهر التاسع."},
{q:"ليلة القدر خير من…",o:["ألف شهر","مائة يوم","سنة واحدة","عشرة أيام"],why:"﴿ليلة القدر خير من ألف شهر﴾."},
{q:"في رمضان أبواب الجنة…",o:["تُفتح","تُغلق","تُنقل","لا تتغير"],why:"تُفتح أبواب الجنة وتُغلق أبواب النار وتُصفّد الشياطين."},
{q:"من ثمار رمضان للمجتمع:",o:["التعاون والتكافل والمحبة","الخصام","الكسل","الإسراف"],why:"الإفطارات الجماعية والصدقة تقوّي المحبة."}
]},
{u:0,title:"صلح الحديبية",b:"خيمة الصلح",ic:"⛺",c:"adam",cards:[
"تعالوا نحكي حكاية! النبي ﷺ [[رأى في المنام]] إنه هو وأصحابه داخلين مكة [[لأداء العمرة]]، فخرج مع حوالي [[1400 صحابي]].",
"النبي ﷺ كان عايز [[يتجنب القتال]]، فبعت [[عثمان بن عفان]] رضي الله عنه لقريش [[يتفاوض]] معاهم.",
"عثمان اتأخر وانتشر خبر إنه اتقتل، فالصحابة [[بايعوا النبي ﷺ تحت الشجرة]] على القتال، واتسمت [[بيعة الرضوان]] لأن ربنا مدحهم:{{﴿لَّقَدْ رَضِيَ اللَّهُ عَنِ الْمُؤْمِنِينَ إِذْ يُبَايِعُونَكَ تَحْتَ الشَّجَرَةِ﴾}}",
"قريش خافت من البيعة دي، فسمحت لعثمان يرجع، وبعتت [[سهيل بن عمرو]] يتفاوض مع النبي ﷺ.",
"بنود الصلح 📜<ul><li>المسلمين [[يرجعوا المدينة السنة دي]]</li><li>[[السنة الجاية]] يدخلوا مكة للعمرة [[3 أيام بس]]</li><li>[[وقف القتال 10 سنين]]</li><li>أي حد يدخل في حلف المسلمين أو قريش براحته</li><li>اللي يجي من قريش للمسلمين [[يرجعوه]]، واللي يروح من المسلمين لقريش [[ما يرجعوهوش]]</li></ul>",
"النبي ﷺ وافق لأنه [[عرف إن الصلح فيه خير للمسلمين]]، وفعلًا: [[المسلمين قدروا ينشروا الدعوة بسلام]] فانتشر الإسلام في الجزيرة العربية 🕊️"
],quiz:[
{q:"مين اللي بعته النبي ﷺ يتفاوض مع قريش؟",o:["عثمان بن عفان","أبو بكر الصديق","سهيل بن عمرو","خالد بن الوليد"],why:"أرسل النبي ﷺ عثمان بن عفان للتفاوض."},
{q:"اتسمت البيعة تحت الشجرة…",o:["بيعة الرضوان","بيعة العقبة","بيعة الحرب","بيعة مكة"],why:"لأن الله رضي عن المؤمنين إذ يبايعونه تحت الشجرة."},
{q:"مدة وقف القتال في الصلح:",o:["10 سنوات","3 أيام","سنة واحدة","5 سنوات"],why:"من بنود الصلح وقف القتال 10 سنوات."},
{q:"قريش بعتت مين يتفاوض مع النبي ﷺ؟",o:["سهيل بن عمرو","أبو سفيان","عثمان بن عفان","العباس"],why:"أرسلت قريش سهيل بن عمرو."},
{q:"أهم نتيجة لصلح الحديبية:",o:["نشر الدعوة بسلام وانتشار الإسلام","حرب كبيرة","هجرة للحبشة","هدم الكعبة"],why:"أتاح الصلح نشر الدعوة بسلام."}
]},
{u:0,title:"أبو ذر الغفاري",b:"إسطبل الفارس",ic:"🐎",c:"layan",cards:[
"تعالوا نتعرف على بطل شجاع! 🐎 اسمه [[جُندب بن جُنادة]]، وهو من فرسان [[قبيلة غِفار]] المشهورة [[بالشدة والقوة]].",
"قبل الإسلام كان [[عاقل ورشيد]]، [[قوي وشجاع]]، و[[حرّم على نفسه شرب الخمر]]، و[[رفض عبادة الأصنام]] بفطرته السليمة لأنه عرف إنها ضلال.",
"سافر [[لمكة]] وسمع من النبي ﷺ، فقلبه نوّر بالإيمان و[[أسلم على طول]]. وكان [[خامس من أسلم]] بعد: خديجة وأبي بكر وعلي وزيد بن حارثة.",
"النبي ﷺ [[نصحه يكتم إسلامه]] علشان قريش ما تأذيهوش، لكنه بشجاعة [[أعلن إسلامه عند الكعبة]]! فضربوه جامد، لحد ما أنقذه [[العباس بن عبد المطلب]] وفكّرهم إن قوافلهم بتعدي على أرض غِفار.",
"النبي ﷺ قال عنه:{{«رحم الله أبا ذر، يمشي وحده، ويموت وحده، ويُبعث وحده»}}وتوفي في مكان اسمه [[الرَّبَذة]].",
"نتعلم منه 💪<ul><li>[[التضحية والجهاد في سبيل الله]]</li><li>[[الشجاعة في قول الحق]]</li><li>[[طلب العلم النافع]]</li></ul>"
],quiz:[
{q:"اسم أبي ذر الغفاري:",o:["جندب بن جنادة","زيد بن ثابت","سعد بن مالك","عمير بن أبي وقاص"],why:"اسمه جندب بن جنادة."},
{q:"أبو ذر من قبيلة…",o:["غِفار","قريش","الأوس","الخزرج"],why:"من فرسان قبيلة غفار."},
{q:"ترتيب أبي ذر في دخول الإسلام:",o:["الخامس","الأول","العاشر","الثاني"],why:"كان خامس من أسلم."},
{q:"مين أنقذ أبا ذر من قريش؟",o:["العباس بن عبد المطلب","أبو جهل","عثمان بن عفان","سعد بن أبي وقاص"],why:"تدخّل العباس وذكّر قريشًا بقوافلها."},
{q:"توفي أبو ذر في مكان اسمه…",o:["الربذة","خيبر","الطائف","اليمامة"],why:"توفي في الربذة."}
]},
{u:0,title:"حق الجار",b:"حي الجيران",ic:"🏘️",c:"lana",cards:[
"هنبني حي فيه جيران بيحبوا بعض 🏘️ المجتمع القوي بيقوم على [[التراحم والتكافل]]، والإسلام خلّى [[الإحسان للجار جزء من الإيمان]].",
"اسمعوا الحديث ده:{{«ما زال جبريلُ يوصيني بالجار حتى ظننتُ أنه سيورّثه»}}يعني الجار مهم جدًا!",
"وحُسن الجوار [[دليل على صدق الإيمان]]:{{«مَن كان يؤمن بالله واليوم الآخر فليُكرم جاره»}}",
"حقوق الجار 🤝<ul><li>[[الكلمة الطيبة]]</li><li>[[مساعدته وقت الحاجة]]</li><li>[[الابتسامة والسؤال عن حاله]]</li><li>[[المحافظة على ممتلكاته]]</li><li>[[مشاركته في الأفراح والأحزان]]</li><li>[[حفظ أسراره وستر عيوبه]]</li></ul>",
"[[حفظ أسرار الجار]] بيبني [[الثقة والاحترام]] بين الجيران.",
"لما نحافظ على حق الجار: [[يسود التعاون]]، وتنتشر [[المودة والألفة]]، ويتحقق [[الاستقرار والسكينة]] 💕"
],quiz:[
{q:"المجتمع القوي يقوم على…",o:["التراحم والتكافل","الخصام","الأنانية","الكسل"],why:"يقوم المجتمع القوي على التراحم والتكافل."},
{q:"«ما زال جبريل يوصيني بالجار حتى ظننت أنه…»",o:["سيورثه","سيزوره","سيتركه","سيبيعه"],why:"حتى ظننت أنه سيورّثه."},
{q:"من كان يؤمن بالله واليوم الآخر فليُ…",o:["كرم جاره","ترك جاره","خاصم جاره","سافر بعيدًا"],why:"فليكرم جاره."},
{q:"حفظ أسرار الجار يؤدي إلى…",o:["الثقة والاحترام","المشاكل","الخصام","البعد"],why:"حفظ الأسرار ينشر الثقة والاحترام."}
]},

{u:1,title:"القرآن الكريم آخر الكتب السماوية",b:"دار القرآن",ic:"📖",c:"eileen",cards:[
"من رحمة ربنا الواسعة إنه [[ما سابش الناس في حيرة]]، [[بعت لهم رسل]] شايلين مشاعل الهداية، و[[أنزل الكتب السماوية]].",
"القرآن [[مهيمن على الكتب السابقة]] يعني [[شاهد عليها ومصدّق لما فيها من حق]].",
"ربنا [[تكفّل بحفظ القرآن]] لأنه [[آخر الكتب السماوية]]، وفضل صافي زي ما كان النبي ﷺ بيقرأه من [[أكتر من 14 قرن]]!{{﴿إِنَّا نَحْنُ نَزَّلْنَا الذِّكْرَ وَإِنَّا لَهُ لَحَافِظُونَ﴾}}",
"أهمية القرآن:<ul><li>[[للفرد]]: [[منهج حياة شامل]] فيه العبادات والمعاملات والأخلاق</li><li>[[للمجتمع]]: يخليه قايم على [[العدل والإحسان]]</li></ul>",
"القرآن [[شفاء للنفوس ورحمة للقلوب]]: [[يزيل الهموم ويمنح السكينة]] 💚",
"والقرآن [[رسالة عالمية]] لكل الناس في كل العصور:{{﴿وَمَا أَرْسَلْنَاكَ إِلَّا كَافَّةً لِّلنَّاسِ بَشِيرًا وَنَذِيرًا﴾}}"
],quiz:[

{q:"القرآن بالنسبة للمجتمع يجعله يقوم على…",o:["العدل والإحسان","الظلم","التفرقة","الكسل"],why:"منهج يجعل المجتمع يقوم على العدل والإحسان."},

]},
{u:1,title:"سورة القيامة",b:"ساحة الميزان",ic:"⚖️",c:"layan",cards:[
"سورة القيامة [[سورة مكية]] نزلت [[في مكة قبل الهجرة]]، وبتفكّرنا [[بيوم القيامة]] وإيه اللي هيحصل فيه.",
"ربنا أقسم [[بالنفس اللوّامة]]: دي [[النفس اللي بتلوم صاحبها على تقصيره]]، والمسلم بيسمع لها و[[يتوب]] 🙏",
"اللي بينكر البعث بيقول: إزاي العظام هترجع؟ السورة ترد: ربنا [[قادر يجمع حتى أطراف الأصابع]] (البنان) رغم إنها صغيرة جدًا!{{﴿بَلَىٰ قَادِرِينَ عَلَىٰ أَن نُّسَوِّيَ بَنَانَهُ﴾}}",
"[[آداب سماع الوحي]]: النبي ﷺ كان بيستعجل يردد القرآن، فربنا طمّنه إنه [[هو اللي هيجمعه في صدره]]:{{﴿لَا تُحَرِّكْ بِهِ لِسَانَكَ لِتَعْجَلَ بِهِ ۝ إِنَّ عَلَيْنَا جَمْعَهُ وَقُرْآنَهُ﴾}}",
"يوم القيامة الناس [[فريقين]]:<ul><li>[[المؤمنين]]: وجوه [[ناضرة]] = حسنة مشرقة، و[[يرون ربهم]] ← الجنة</li><li>[[الكافرين]]: وجوه [[باسرة]] = عابسة ← النار</li></ul>",
"السورة بترشدنا: نؤمن [[بقدرة الله وبيوم القيامة]]، ونستعد له بالطاعة، ونستفيد من [[النفس اللوامة بالتوبة]]، و[[نقدّم الآخرة على الدنيا]] لأنها خير وأبقى."
],quiz:[
{q:"سورة القيامة سورة…",o:["مكية","مدنية","نزلت في خيبر","نزلت بعد فتح مكة"],why:"نزلت في مكة قبل الهجرة."},
{q:"النفس اللوامة هي النفس التي…",o:["تلوم صاحبها على تقصيره","تحب الكسل","تأمر بالسوء دائمًا","لا تهتم"],why:"تلوم صاحبها فيتوب."},
{q:"«بنانه» يعني…",o:["أطراف أصابعه","عينه","قلبه","بيته"],why:"البنان أطراف الأصابع، والله قادر على جمعها."},
{q:"وجوه «ناضرة» يعني…",o:["حسنة مشرقة","عابسة","حزينة","خائفة"],why:"وجوه المؤمنين ناضرة، ووجوه الكفار باسرة (عابسة)."}
]},
{u:1,title:"مخارج الحروف",b:"بيت الحروف",ic:"🏠",c:"lana",cards:[
"[[المخرج]] هو [[المكان اللي الحرف بيخرج منه]] 👄 والمخارج العامة 5: [[الجوف - الحلق - اللسان - الشفتان - الخيشوم]].",
"[[الجوف]]: الفراغ اللي جوه الحلق والفم، وبتخرج منه [[حروف المد الثلاثة: ا - و - ي]].",
"[[الحلق]] 3 أدوار:<ul><li>[[أقصى الحلق]]: ء - هـ</li><li>[[وسط الحلق]]: ع - ح</li><li>[[أدنى الحلق]]: غ - خ</li></ul>",
"[[اللسان]]:<ul><li>[[أقصى اللسان]]: ق - ك</li><li>[[وسط اللسان]]: ج - ش - ي</li><li>[[حافة اللسان]]: ض - ل</li><li>[[طرف اللسان]]: ن ر ت د ط ز ص س ذ ث ظ</li></ul>",
"[[الشفتان]]: ف - و - ب - م 💋<br>[[الخيشوم]] (تجويف الأنف): منه [[صوت الغنة]] في النون والميم.",
"سرّ صغير 🤫 علشان تعرفي مخرج أي حرف: [[حطي قبله همزة]] وانطقيه [[ساكن]]: أَبْ ، أَشْ ، أَظْ"
],quiz:[
{q:"حروف المد الثلاثة تخرج من…",o:["الجوف","الشفتين","الخيشوم","طرف اللسان"],why:"الجوف مخرج حروف المد."},
{q:"العين والحاء يخرجان من…",o:["وسط الحلق","أقصى الحلق","أدنى الحلق","الشفتين"],why:"وسط الحلق: ع، ح."},
{q:"صوت الغنة يخرج من…",o:["الخيشوم","الجوف","وسط اللسان","أقصى الحلق"],why:"الخيشوم = تجويف الأنف، ومنه الغنة."},
{q:"حروف الشفتين:",o:["ف - و - ب - م","ق - ك","ء - هـ","ج - ش - ي"],why:"الشفتان: ف و ب م."},
{q:"القاف والكاف تخرجان من…",o:["أقصى اللسان","طرف اللسان","الشفتين","الجوف"],why:"أقصى اللسان: ق، ك."}
]},
{u:1,title:"معنى الصوم",b:"بئر الصبر",ic:"⛲",c:"adam",cards:[
"[[الصوم]] هو [[الامتناع عن المفطرات]] زي الأكل والشرب [[من طلوع الفجر لغروب الشمس]] ☀️➡️🌙",
"الصوم [[فريضة على كل مسلم بالغ عاقل مقيم قادر]].",
"ربنا فرض علينا الصيام علشان [[نتعلم التقوى]]:{{﴿يَا أَيُّهَا الَّذِينَ آمَنُوا كُتِبَ عَلَيْكُمُ الصِّيَامُ كَمَا كُتِبَ عَلَى الَّذِينَ مِن قَبْلِكُمْ لَعَلَّكُمْ تَتَّقُونَ﴾}}",
"أثر الصوم 💪<ul><li>[[يقوّي الإرادة]] (أحسن نصيحة لصاحبك اللي عايز إرادة قوية!)</li><li>[[يعلّم الصبر]]</li><li>[[يحسّسنا بالفقراء]]: الصائم عارف هياكل إمتى، لكن الفقير ممكن ما يعرفش ← فيمتلئ قلبه [[رحمة]] وإيده [[عطاء]]</li></ul>",
"ثواب كبير:{{«مَن صام رمضانَ إيمانًا واحتسابًا غُفر له ما تقدّم من ذنبه»}}",
"[[للصائم فرحتان]] 😊<ul><li>[[فرحة عند فطره]]</li><li>[[فرحة عند لقاء ربه]]</li></ul>"
],quiz:[
{q:"الصوم من…",o:["طلوع الفجر إلى غروب الشمس","الظهر إلى العصر","المغرب إلى العشاء","الشروق إلى الظهر"],why:"من طلوع الفجر إلى غروب الشمس."},
{q:"الحكمة من فرض الصيام:",o:["نتعلم التقوى","نخس فقط","ننام كتير","نلعب"],why:"﴿لعلكم تتقون﴾."},
{q:"صاحبك عايز يقوّي إرادته، تنصحيه بـ…",o:["الصوم","السهر","الأكل الكتير","اللعب طول اليوم"],why:"الصوم أعظم وسيلة لتقوية الإرادة."},
{q:"فرحتا الصائم:",o:["عند فطره وعند لقاء ربه","عند النوم والصحيان","في العيد بس","عند السفر"],why:"للصائم فرحتان: عند فطره وعند لقاء ربه."}
]},
{u:1,title:"رسائل النبي ﷺ إلى الملوك",b:"بيت البريد",ic:"🏤",c:"eileen",cards:[
"بعد [[صلح الحديبية]] بقى فيه سلام، فالنبي ﷺ بدأ [[يدعو للإسلام خارج الجزيرة العربية]] بالرسائل ✉️",
"بعت رسائل لـ:<ul><li>[[هرقل]] إمبراطور الروم</li><li>[[النجاشي]] ملك الحبشة</li><li>[[كسرى]] ملك الفرس</li><li>[[المقوقس]] حاكم مصر</li><li>ملوك [[البحرين وعُمان واليمامة]]</li></ul>",
"السفراء كانوا مميزين بـ[[الفصاحة والحكمة والصبر]]، وعارفين أحوال الشعوب. وده بيدل على حرص النبي على الدعوة [[بالحكمة والموعظة الحسنة]].",
"ردود الملوك:<ul><li>[[آمن وأسلم قومه]]: ملك البحرين وملك عُمان</li><li>[[أسلم وكتم إسلامه]]: النجاشي</li><li>[[احترم الرسالة وما أسلمش]] خوفًا على ملكه: هرقل، والمقوقس [[بعت هدايا]]</li><li>[[تكبّر ومزّق الرسالة]]: كسرى</li></ul>",
"النبي ﷺ دعا على كسرى: [[«أن يُمزَّقوا كل ممزَّق»]]، و[[سقط ملكه فعلًا]]! وده دليل على [[صدق نبوة]] سيدنا محمد ﷺ.",
"الرسائل أكدت إن [[الإسلام دين عالمي]] للإنسانية كلها، وإن الدعوة [[بالحوار والحكمة مش بالإكراه]] 🌍"
],quiz:[
{q:"متى بدأ النبي ﷺ مراسلة الملوك؟",o:["بعد صلح الحديبية","قبل الهجرة","بعد غزوة خيبر بعشر سنين","في أول البعثة"],why:"بعد صلح الحديبية لأنه أتاح الدعوة بسلام."},
{q:"الملك الذي أسلم وكتم إسلامه:",o:["النجاشي","كسرى","هرقل","المقوقس"],why:"النجاشي ملك الحبشة أسلم وكتم إسلامه."},
{q:"الملك الذي مزّق الرسالة:",o:["كسرى ملك الفرس","المقوقس","ملك عمان","هرقل"],why:"كسرى مزّق الرسالة فسقط ملكه."},
{q:"حاكم مصر الذي أرسل هدايا للنبي ﷺ:",o:["المقوقس","النجاشي","هرقل","كسرى"],why:"المقوقس أكرم الرسول وأرسل هدايا."}
]},
{u:1,title:"زيد بن ثابت",b:"ديوان كتّاب الوحي",ic:"📜",c:"eileen",cards:[
"[[زيد بن ثابت]] رضي الله عنه [[اتولد في المدينة]]، و[[في سن 6 سنين]] فقد أبوه [[يوم بُعاث]]، فعاش [[يتيم]].",
"[[أسلم بعد الهجرة]] وعمره [[11 سنة]] بس!",
"النبي ﷺ أمره [[يتعلم اللغات]]، فاتعلم [[العبرية والسريانية]] في وقت قصير جدًا، وبقى [[مترجم للرسول ﷺ]] و[[كاتب للوحي]] ✍️",
"النبي ﷺ دعا له بالبركة، فـ:<ul><li>[[حفظ القرآن صغير]]</li><li>[[بقى مرجع في العلم والفرائض]]</li></ul>وقال عنه ﷺ: [[«وأفرضُهم زيد بن ثابت»]] يعني [[أعلم الصحابة بالمواريث]].",
"بعد وفاة النبي ﷺ و[[استشهاد كتير من الحفاظ في معركة اليمامة]]، [[أبو بكر الصديق]] كلّفه [[يجمع القرآن في مصحف واحد]]، فجمعه [[من الصحف وصدور الرجال]].",
"قال عن المهمة دي:{{«فوالله لو كلّفوني نقلَ جبلٍ من الجبال ما كان أثقلَ عليّ مما أمرني به من جمع القرآن»}}وتوفي سنة [[45 هـ]]."
],quiz:[
{q:"زيد بن ثابت أسلم وعمره…",o:["11 سنة","6 سنوات","20 سنة","17 سنة"],why:"أسلم بعد الهجرة وهو في الحادية عشرة."},
{q:"«وأفرضهم زيد بن ثابت» تعني أنه أعلم الصحابة بـ…",o:["المواريث","الحرب","التجارة","الشعر"],why:"الفرائض = علم المواريث."},
{q:"من كلّف زيدًا بجمع القرآن؟",o:["أبو بكر الصديق","عمر بن الخطاب وحده","علي بن أبي طالب","سعد بن أبي وقاص"],why:"كلّفه أبو بكر بعد معركة اليمامة."},
{q:"اللغتان اللتان تعلمهما زيد:",o:["العبرية والسريانية","الفارسية والرومية","الإنجليزية والفرنسية","الحبشية والقبطية"],why:"تعلّم العبرية والسريانية في وقت قصير."},
{q:"سبب جمع القرآن في مصحف واحد:",o:["استشهاد كثير من الحفاظ في معركة اليمامة","ضياع الكتب","طلب كسرى","فتح خيبر"],why:"بعد استشهاد عدد من الحفاظ في اليمامة."}
]},
{u:1,title:"طلب العلم",b:"مدرسة العلم",ic:"🏫",c:"eileen",cards:[
"أول أمر نزل في القرآن كان [[القراءة]]! 📚{{﴿اقْرَأْ بِاسْمِ رَبِّكَ الَّذِي خَلَقَ﴾}}وده بيدل على [[أهمية العلم وضرورة طلبه]].",
"الإسلام أمر بطلب العلم لأن [[بالعلم المسلم بيؤدي العبادات صح]] و[[بيتعامل مع الناس وفق شرع الله]].",
"[[للفرد]]: [[ترتفع منزلته]] ويقدر يحقق أهدافه وطموحاته.<br>[[للمجتمع]]: [[يتقدم]] ويقدر يواجه الصعوبات ويحقق الانتصارات.",
"طلب العلم مسئولية عظيمة علشان الأمة تكون [[قائدة للبشرية]] في طريق الخير.",
"وفي الآخرة؟ طلب العلم [[عبادة]] و[[طريق للجنة]]:{{«مَن سلك طريقًا يلتمس فيه علمًا سهّل الله له طريقًا إلى الجنة»}}",
"وكمان: [[الملائكة بتفرش أجنحتها لطالب العلم]]، و[[بيستغفر له كل اللي في السماوات والأرض حتى الحيتان في المية]] 🐳 و[[العلماء ورثة الأنبياء]]."
],quiz:[
{q:"أول أمر نزل به القرآن:",o:["اقرأ","صلِّ","صُم","اسمع"],why:"﴿اقرأ باسم ربك الذي خلق﴾."},
{q:"«من سلك طريقًا يلتمس فيه علمًا سهّل الله له طريقًا إلى…»",o:["الجنة","السوق","البحر","المدينة"],why:"سهّل الله له طريقًا إلى الجنة."},
{q:"«العلماء ورثة…»",o:["الأنبياء","الملوك","التجار","الفرسان"],why:"العلماء ورثة الأنبياء."},
{q:"أثر العلم على المجتمع:",o:["يتقدم ويواجه الصعوبات","يتأخر","يتفرق","لا شيء"],why:"بالعلم يتقدم المجتمع."}
]},

{u:2,title:"نزول القرآن الكريم",b:"مرصد ليلة القدر",ic:"🌙",c:"layan",cards:[
"القرآن الكريم هو [[كلام الله المنزّل على سيدنا محمد ﷺ]]، و[[آخر الكتب السماوية]]، نزل [[هداية ونور للبشرية]] ✨",
"[[اللوح المحفوظ]] هو [[الكتاب اللي ربنا كتب فيه ما كان وما سيكون]] من أمر الخلق.",
"القرآن نزل على [[مرحلتين]]:<br>🌙 [[المرحلة الأولى]]: نزل [[جملة واحدة]] من [[اللوح المحفوظ إلى السماء الدنيا]] في [[ليلة القدر]].{{﴿إِنَّا أَنزَلْنَاهُ فِي لَيْلَةِ الْقَدْرِ﴾}}",
"📖 [[المرحلة الثانية]]: نزل [[مفرّقًا]] (أجزاء) على النبي ﷺ [[عن طريق جبريل]] عليه السلام، حسب الأحداث، خلال [[23 سنة]].",
"ليه نزل مفرّق؟<ul><li>[[تثبيت قلب النبي ﷺ]]</li><li>[[التدرج في التشريع]]</li><li>[[يوافق الأحداث]]</li><li>[[تسهيل الحفظ والفهم]]</li></ul>",
"ربنا رضي لنا الإسلام دينًا:{{﴿الْيَوْمَ أَكْمَلْتُ لَكُمْ دِينَكُمْ وَأَتْمَمْتُ عَلَيْكُمْ نِعْمَتِي وَرَضِيتُ لَكُمُ الْإِسْلَامَ دِينًا﴾}}واجبنا: [[نفهم آياته، ونعمل بيها، ونعلّمها]]."
],quiz:[
{q:"في المرحلة الأولى نزل القرآن من اللوح المحفوظ إلى…",o:["السماء الدنيا","الأرض مباشرة","الجبل","الكعبة"],why:"نزل جملة واحدة إلى السماء الدنيا في ليلة القدر."},
{q:"مدة نزول القرآن مفرقًا:",o:["23 سنة","10 سنوات","40 سنة","سنة واحدة"],why:"خلال 23 عامًا."},
{q:"الملك الذي نزل بالقرآن على النبي ﷺ:",o:["جبريل عليه السلام","ميكائيل","إسرافيل","مالك"],why:"عن طريق جبريل عليه السلام."},
{q:"من حِكم نزول القرآن مفرّقًا:",o:["تثبيت قلب النبي والتدرج في التشريع","سرعة الانتهاء","لأنه طويل فقط","بدون سبب"],why:"تثبيت القلب، التدرج، موافقة الأحداث، تيسير الحفظ."},
{q:"اللوح المحفوظ هو…",o:["كتاب كتب الله فيه ما كان وما سيكون","لوح في المدرسة","صحيفة أبي بكر","مصحف عثمان"],why:"سطّر الله فيه ما كان وما سيكون."}
]},

/* ---------- state ---------- */
const KEY="wahat-alnoor-v1";
let S={coins:20,stars:{},built:{},harvest:{},decor:[[],[],[]],seen:false,best:0};
try{const raw=localStorage.getItem(KEY); if(raw) S=Object.assign(S,JSON.parse(raw));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const HARVEST_MS=90*1000, HARVEST_AMT=5;

const $=s=>document.querySelector(s);
const esc=s=>s;
function rich(t){
  return t.replace(/\[\[(.+?)\]\]/g,"<mark>$1</mark>").replace(/\{\{(.+?)\}\}/g,'<span class="quote">$1</span>');
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function builtCount(){return Object.keys(S.built).length}
function starTotal(){return Object.values(S.stars).reduce((a,b)=>a+b,0)}
function nextIdx(){for(let i=0;i<L.length;i++) if(!S.built[i]) return i; return -1}
function unitUnlocked(u){ if(u===0) return true; const prev=L.map((l,i)=>[l,i]).filter(([l])=>l.u===u-1); return prev.filter(([,i])=>S.built[i]).length>=Math.ceil(prev.length*0.5); }

function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
function bump(id){const e=$(id);e.classList.remove("bump");void e.offsetWidth;e.classList.add("bump")}
function addCoins(n){S.coins+=n;save();renderHud();bump("#pCoins")}
function confetti(n=40){const set=["🎉","⭐","🌸","🪙","✨","💚"];for(let i=0;i<n;i++){const c=document.createElement("div");c.className="confetti";c.textContent=set[i%set.length];c.style.left=Math.random()*100+"vw";c.style.animationDuration=(1.8+Math.random()*1.8)+"s";c.style.animationDelay=(Math.random()*.6)+"s";document.body.appendChild(c);setTimeout(()=>c.remove(),4200)}}

/* ---------- render world ---------- */
function renderHud(){
  $("#coins").textContent=S.coins; $("#stars").textContent=starTotal(); $("#built").textContent=builtCount();
  const b=builtCount();
  $("#welcome").textContent = b===0?"الصحرا مستنية تتبني بالعلم!": b<7?"الواحة بدأت تخضرّ 🌱": b<14?"القرية بتكبر وتنوّر ✨": b<20?"المدينة قربت تكمل 🏙️":"الواحة كاملة! أنتِ بطلة 🏆";
}
function renderWorld(){
  const w=$("#world"); w.innerHTML="";
  const nx=nextIdx();
  UNITS.forEach((U,u)=>{
    const idx=L.map((l,i)=>i).filter(i=>L[i].u===u);
    const done=idx.filter(i=>S.built[i]).length;
    const open=unitUnlocked(u);
    const sec=document.createElement("section");
    sec.className="region"+(open?"":" locked");
    sec.innerHTML=`<div class="bg"></div><div class="green" style="opacity:${(done/idx.length)*0.95}"></div><div class="decor"></div>
      <div class="region-head"><div class="ribbon">${U.place}<small>${U.n}: ${U.t} · ${done}/${idx.length}</small></div></div>
      ${open?"":`<div class="lock-note">🔒 ابني نص مباني ${UNITS[u-1].place} الأول علشان تفتحي هنا</div>`}
      <div class="plots"></div>`;
    const dec=sec.querySelector(".decor");
    (S.decor[u]||[]).forEach(d=>{const s=document.createElement("span");s.textContent=d.e;s.style.left=d.x+"%";s.style.top=d.y+"%";dec.appendChild(s)});
    const plots=sec.querySelector(".plots");
    idx.forEach(i=>{
      const l=L[i], isB=!!S.built[i];
      const p=document.createElement("button");
      p.className="plot"+(isB?" built":"")+(i===nx&&open?" next":"");
      p.setAttribute("aria-label",(isB?"افتحي ":"ابني ")+l.b+" - "+l.title);
      const ready=isB && (Date.now()-(S.harvest[i]||0))>=HARVEST_MS;
      p.innerHTML=`<div class="land"><span class="bld">${l.ic}</span>${isB?"":`<span class="sign">🔨 ابني</span>`}</div>
        ${ready?`<span class="harvest" data-h="${i}" title="اجمعي العملات">🪙</span>`:""}
        ${i===nx&&open?`<span class="pin" aria-hidden="true">👇</span>`:""}
        <span class="label">${isB?l.b:l.title}</span>
        <span class="stars">${isB?"⭐".repeat(S.stars[i]||1)+"☆".repeat(3-(S.stars[i]||1)):""}</span>`;
      p.onclick=(ev)=>{
        if(ev.target.dataset.h){ev.stopPropagation(); S.harvest[i]=Date.now(); addCoins(HARVEST_AMT); toast(`+${HARVEST_AMT} 🪙 من ${l.b}`); renderWorld(); return;}
        if(!open){toast("🔒 المنطقة دي لسه مقفولة");return}
        isB?builtMenu(i):startLesson(i);
      };
      plots.appendChild(p);
    });
    w.appendChild(sec);
  });
  renderHud();
}
setInterval(()=>{ if(!$("#layer").innerHTML) renderWorld(); },15000);

/* ---------- modal helpers ---------- */
function openModal(html){
  $("#layer").innerHTML=`<div class="overlay" role="dialog" aria-modal="true"><div class="modal">${html}</div></div>`;
  const ov=$("#layer .overlay"); ov.addEventListener("click",e=>{if(e.target===ov)closeModal()});
  return $("#layer .modal");
}
function closeModal(){ $("#layer").innerHTML=""; renderWorld(); }
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#layer").innerHTML)closeModal()});
function head(l,sub){return `<div class="m-head"><span class="ic">${l.ic}</span><div><h2>${l.b}</h2><p>${sub}</p></div><button class="x" aria-label="إغلاق" onclick="closeModal()">✕</button></div>`}

/* ---------- lesson: story ---------- */
let cur=null;
function startLesson(i,{review=false}={}){ cur={i,card:0,review}; showCard(); }
function showCard(){
  const l=L[cur.i], ch=CH[l.c], k=cur.card, n=l.cards.length;
  const m=openModal(`${head(l,"الدرس: "+l.title+" · "+UNITS[l.u].n)}
    <div class="m-body">
      <div class="scene"><img src="${IMG[l.c]}" alt="${ch.name}">
        <div class="bubble"><span class="who" style="background:${ch.color}">${ch.name}</span><div>${rich(l.cards[k])}</div></div></div>
      <div class="dots">${l.cards.map((_,j)=>`<i class="${j<=k?"on":""}"></i>`).join("")}</div>
      <div class="brick-note">🧱 جمعتي ${k+1} من ${n} طوب للمبنى</div>
      <div class="nav">
        <button class="btn alt" id="prev" ${k===0?"disabled style='opacity:.4'":""}>→ السابق</button>
        <button class="btn ${k===n-1?"green":""}" id="next">${k===n-1?(cur.review?"تمام، رجوع للواحة ✔":"🔨 يلا نبني!"):"التالي ←"}</button>
      </div>
    </div>`);
  m.querySelector("#prev").onclick=()=>{if(cur.card>0){cur.card--;showCard()}};
  m.querySelector("#next").onclick=()=>{ if(cur.card<n-1){cur.card++;showCard()} else if(cur.review){closeModal()} else startBuild(); };
}

/* ---------- lesson: build quiz ---------- */
function startBuild(){
  const l=L[cur.i];
  cur.queue=shuffle(l.quiz.map((_,j)=>j)); cur.okSet=new Set(); cur.mistakes=0; cur.firstTry=0; cur.tried=new Set();
  showQ();
}
function showQ(){
  const l=L[cur.i], ch=CH[l.c], total=l.quiz.length, qi=cur.queue[0], Q=l.quiz[qi];
  const pct=100-(cur.okSet.size/total)*100;
  const opts=shuffle(Q.o.map((t,j)=>({t,ok:j===0})));
  const m=openModal(`${head(l,"وقت البناء! كل إجابة صح = دور جديد")}
    <div class="m-body">
      <div class="site"><span class="crane" aria-hidden="true">🏗️</span><span class="ghost">${l.ic}</span><span class="real" style="clip-path:inset(${pct}% 0 0 0)">${l.ic}</span></div>
      <div class="meter">${l.quiz.map((_,j)=>`<b class="${j<cur.okSet.size?"ok":""}"></b>`).join("")}</div>
      <div class="qnar"><img src="${IMG[l.c]}" alt=""><div class="qtext">${Q.q}</div></div>
      <div class="opts">${opts.map((o,j)=>`<button class="opt" data-ok="${o.ok?1:0}">${o.t}</button>`).join("")}</div>
      <div id="fb"></div>
    </div>`);
  m.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    if(m.dataset.lock)return;
    const ok=b.dataset.ok==="1";
    if(ok){
      m.dataset.lock=1; b.classList.add("right");
      if(!cur.tried.has(qi)) cur.firstTry++;
      cur.okSet.add(qi); cur.queue.shift();
      m.querySelector(".real").style.clipPath=`inset(${100-(cur.okSet.size/total)*100}% 0 0 0)`;
      m.querySelectorAll(".meter b").forEach((x,j)=>x.classList.toggle("ok",j<cur.okSet.size));
      const praise=["برافو! 👏","أيوه كده! 💪","شاطرة جدًا! 🌟","صح عليكي! ✨","الله ينور! 💚"][Math.floor(Math.random()*5)];
      m.querySelector("#fb").innerHTML=`<div class="why good"><b>${praise}</b> ${Q.why}</div><div class="nav" style="justify-content:flex-end"><button class="btn green" id="go">${cur.queue.length?"الدور اللي بعده ←":"🏁 خلّصي المبنى"}</button></div>`;
      m.querySelector("#go").onclick=()=>{cur.queue.length?showQ():finishLesson()};
      m.querySelector("#go").focus();
    }else{
      b.classList.add("wrong"); b.disabled=true; cur.mistakes++; cur.tried.add(qi);
      m.querySelector("#fb").innerHTML=`<div class="why bad"><b>${CH[l.c].name}:</b> قربتي! 🤏 جربي تاني… ${Q.why}</div>`;
    }
  });
}
function finishLesson(){
  const l=L[cur.i], i=cur.i, total=l.quiz.length;
  const stars = cur.mistakes===0?3: cur.mistakes<=2?2:1;
  const first = !S.built[i];
  const prevStars=S.stars[i]||0;
  const coins = first? (cur.firstTry*5 + 10) : Math.max(0,(stars-prevStars))*5 + 3;
  S.built[i]=Date.now(); S.stars[i]=Math.max(prevStars,stars); if(first) S.harvest[i]=Date.now();
  S.coins+=coins; save();
  confetti(stars*15);
  const allDone=builtCount()===L.length;
  const m=openModal(`${head(l,"المبنى خلص!")}
    <div class="m-body done">
      <div class="ic">${l.ic}</div>
      <h3>${first?"مبروك! بنيتي "+l.b:"راجعتي "+l.b+" 💪"}</h3>
      <div class="reward"><span>${"⭐".repeat(stars)}${"☆".repeat(3-stars)}</span><span>+${coins} 🪙</span></div>
      <p>${allDone?"🏆 الواحة كلها اتبنت! خلّصتي كل دروس الترم الأول. جربي التحدي علشان تراجعي كل حاجة!":"المبنى ده هيطلع لك عملات كل شوية، دوسي على 🪙 اللي فوقه علشان تجمعيها. واشتري زينة للواحة من السوق 🛒"}</p>
      <div class="center"><button class="btn green big" id="home">رجوع للواحة 🌴</button></div>
    </div>`);
  m.querySelector("#home").onclick=closeModal;
}

/* ---------- built building menu ---------- */
function builtMenu(i){
  const l=L[i];
  const m=openModal(`${head(l,l.title)}
    <div class="m-body">
      <div class="scene"><img src="${IMG[l.c]}" alt="${CH[l.c].name}"><div class="bubble"><span class="who" style="background:${CH[l.c].color}">${CH[l.c].name}</span><div>${l.b} بتاعتك جاهزة ${"⭐".repeat(S.stars[i]||1)}! عايزة تعملي إيه؟</div></div></div>
      <div class="menu" style="margin-top:14px">
        <button class="btn alt big" id="r">📖 اقري الحكاية تاني</button>
        <button class="btn big" id="q">🔨 أعيدي البناء واجمعي نجوم</button>
        <button class="btn alt big" id="s">📝 ملخص سريع</button>
      </div>
    </div>`);
  m.querySelector("#r").onclick=()=>startLesson(i,{review:true});
  m.querySelector("#q").onclick=()=>{cur={i};startBuild()};
  m.querySelector("#s").onclick=()=>summary(i);
}
function summary(i){
  const l=L[i];
  const m=openModal(`${head(l,"ملخص: "+l.title)}
    <div class="m-body"><div class="bubble" style="font-size:16.5px">${l.quiz.map(Q=>`<div style="margin-bottom:8px">❓ ${Q.q}<br>✅ <mark>${Q.o[0]}</mark></div>`).join("")}</div>
    <div class="center"><button class="btn green" onclick="builtMenu(${i})">رجوع</button></div></div>`);
}

/* ---------- quick challenge ---------- */
function quick(){
  const pool=[]; Object.keys(S.built).forEach(i=>L[i].quiz.forEach(Q=>pool.push({Q,i:+i})));
  if(pool.length<4){toast("ابني مبنى واحد على الأقل الأول 🔨");return}
  const qs=shuffle(pool).slice(0,8); let k=0, score=0;
  const step=()=>{
    if(k>=qs.length){ const c=score*3; S.coins+=c; if(score>S.best)S.best=score; save(); confetti(score*4);
      const m=openModal(`<div class="m-head"><span class="ic">⚡</span><div><h2>نتيجة التحدي</h2><p>أحسن نتيجة: ${S.best}/8</p></div><button class="x" onclick="closeModal()" aria-label="إغلاق">✕</button></div>
      <div class="m-body done"><div class="ic">${score>=7?"🏆":score>=4?"🌟":"💪"}</div><h3>${score} من ${qs.length}</h3><div class="reward"><span>+${c} 🪙</span></div>
      <div class="center"><button class="btn big" id="again">تحدي تاني ⚡</button><button class="btn green big" onclick="closeModal()">الواحة 🌴</button></div></div>`);
      m.querySelector("#again").onclick=quick; return; }
    const {Q,i}=qs[k], l=L[i];
    const opts=shuffle(Q.o.map((t,j)=>({t,ok:j===0})));
    const m=openModal(`<div class="m-head"><span class="ic">⚡</span><div><h2>تحدي السرعة</h2><p>سؤال ${k+1} من ${qs.length} · من ${l.b} ${l.ic}</p></div><button class="x" onclick="closeModal()" aria-label="إغلاق">✕</button></div>
      <div class="m-body"><div class="meter">${qs.map((_,j)=>`<b class="${j<k?"ok":""}"></b>`).join("")}</div>
      <div class="qnar"><img src="${IMG[l.c]}" alt=""><div class="qtext">${Q.q}</div></div>
      <div class="opts">${opts.map(o=>`<button class="opt" data-ok="${o.ok?1:0}">${o.t}</button>`).join("")}</div><div id="fb"></div></div>`);
    m.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      if(m.dataset.lock)return; m.dataset.lock=1;
      const ok=b.dataset.ok==="1"; if(ok)score++;
      b.classList.add(ok?"right":"wrong");
      m.querySelectorAll(".opt").forEach(x=>{if(x.dataset.ok==="1")x.classList.add("right")});
      m.querySelector("#fb").innerHTML=`<div class="why ${ok?"good":"bad"}">${ok?"✔ صح!":"✘ الإجابة الصح متعلّمة بالأخضر."} ${Q.why}</div><div class="nav" style="justify-content:flex-end"><button class="btn green" id="go">التالي ←</button></div>`;
      m.querySelector("#go").onclick=()=>{k++;step()}; m.querySelector("#go").focus();
    });
  };
  step();
}

/* ---------- shop ---------- */
let shopRegion=0;
function shop(){
  const m=openModal(`<div class="m-head"><span class="ic">🛒</span><div><h2>سوق الواحة</h2><p>معاكي ${S.coins} 🪙 · اختاري المنطقة واشتري زينة</p></div><button class="x" onclick="closeModal()" aria-label="إغلاق">✕</button></div>
    <div class="m-body">
      <div class="region-pick">${UNITS.map((U,u)=>`<button data-u="${u}" class="${u===shopRegion?"on":""}" ${unitUnlocked(u)?"":"disabled style='opacity:.4'"}>${U.place}</button>`).join("")}</div>
      <div class="shop">${SHOP.map((it,j)=>`<button class="item" data-j="${j}" ${S.coins<it.p?"disabled":""}><div class="e">${it.e}</div><b>${it.n}</b>${it.p} 🪙</button>`).join("")}</div>
      <p style="text-align:center;font-weight:700;color:var(--ink-soft)">💡 العملات بتيجي من بناء المباني، وجمع 🪙 من فوقها، وتحدي السرعة.</p>
    </div>`);
  m.querySelectorAll(".region-pick button").forEach(b=>b.onclick=()=>{shopRegion=+b.dataset.u;shop()});
  m.querySelectorAll(".item").forEach(b=>b.onclick=()=>{
    const it=SHOP[+b.dataset.j]; if(S.coins<it.p)return;
    S.coins-=it.p;
    const side=Math.random()<.5; S.decor[shopRegion].push({e:it.e,x:side?2+Math.random()*10:86+Math.random()*10,y:12+Math.random()*78});
    save(); toast(`${it.e} ${it.n} اتحطت في ${UNITS[shopRegion].place}`); shop();
  });
}

/* ---------- menu & intro ---------- */
function menu(){
  const m=openModal(`<div class="m-head"><span class="ic">🌴</span><div><h2>القائمة</h2><p>${builtCount()} مبنى من 20 · ${starTotal()} نجمة</p></div><button class="x" onclick="closeModal()" aria-label="إغلاق">✕</button></div>
    <div class="m-body menu">
      <button class="btn alt big" id="i">👋 الحكاية من الأول</button>
      <button class="btn alt big" id="z">🔄 ابدئي اللعبة من جديد</button>
      <div id="conf"></div>
    </div>`);
  m.querySelector("#i").onclick=intro;
  m.querySelector("#z").onclick=()=>{
    m.querySelector("#conf").innerHTML=`<div class="why bad">متأكدة؟ كل المباني والعملات هتتمسح.<div class="center"><button class="btn" id="yes" style="background:var(--bad);color:#fff;box-shadow:0 4px 0 #9b1c1f">أيوه امسحي</button><button class="btn alt" onclick="closeModal()">لأ خلاص</button></div></div>`;
    m.querySelector("#yes").onclick=()=>{S={coins:20,stars:{},built:{},harvest:{},decor:[[],[],[]],seen:true,best:0};save();closeModal();toast("بدأنا من جديد 🏜️")};
  };
}
function intro(){
  const pages=[
    `<h1>واحة النور</h1><div class="cast">${["lana","layan","eileen","adam"].map(k=>`<img src="${IMG[k]}" alt="${CH[k].name}">`).join("")}</div><p>لانا وليان وإيلين وآدم وصلوا لـ<b>صحرا فاضية</b> 🏜️ مفيهاش غير رمل وشمس.</p>`,
    `<div class="cast"><img src="${IMG.adam}" alt="آدم"></div><p><b>آدم:</b> يا جماعة! لقيت خريطة قديمة مكتوب عليها:</p><p style="font-family:var(--display);font-size:24px">«كل معلومة تتعلموها… تبني حجر في الواحة»</p>`,
    `<div class="cast"><img src="${IMG.eileen}" alt="إيلين"><img src="${IMG.lana}" alt="لانا"></div><p><b>إيلين:</b> يعني كل درس دين = مبنى جديد! 📚🕌🏰</p><p>اقري الحكاية 📖 ← جاوبي على الأسئلة 🔨 ← المبنى يطلع دور دور ← الصحرا تخضرّ 🌳</p>`,
    `<div class="cast"><img src="${IMG.layan}" alt="ليان"></div><p><b>ليان:</b> وكل مبنى بيطلّع <b>عملات 🪙</b> نشتري بيها نخل وجمال وفوانيس للواحة!</p><p>دوسي على الأرض اللي عليها 👇 علشان نبدأ.</p>`
  ];
  let k=0;
  const draw=()=>{const m=openModal(`<div class="m-body intro">${pages[k]}<div class="dots">${pages.map((_,j)=>`<i class="${j<=k?"on":""}"></i>`).join("")}</div>
    <div class="center">${k<pages.length-1?`<button class="btn alt" id="skip">تخطي</button><button class="btn big" id="nx">التالي ←</button>`:`<button class="btn green big" id="nx">يلا نبني! 🔨</button>`}</div></div>`);
    m.querySelector("#nx").onclick=()=>{ if(k<pages.length-1){k++;draw()} else {S.seen=true;save();closeModal()} };
    const sk=m.querySelector("#skip"); if(sk) sk.onclick=()=>{S.seen=true;save();closeModal()};
  };
  draw();
}

$("#bShop").onclick=shop; $("#bQuick").onclick=quick; $("#bMenu").onclick=menu;
renderWorld();
if(!S.seen) intro();
</script>

</body></html>
